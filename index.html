<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

  <style>
    @view-transition {
      navigation: auto;
    }

    /* 1. Reset Body to dark canvas, center the 16:9 box */
    body {
      background-color: #0a0a0a; /* Dark background surrounding the panel */
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Michroma', sans-serif;
      overflow: hidden;
    }

    /* 2. 16:9 Panel Container */
    .aspect-panel {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      background-color: #000000; /* Pure black panel background */
      box-sizing: border-box;
      padding-left: 6%;
      padding-top: 18%; /* Position content within the 16:9 panel */
      position: relative;
      overflow: hidden;
      
      /* Visual border to define the 16:9 frame */
      outline: 1px solid #222222; 
    }

    .aspect-panel.page-slide-out-left {
      animation: slidePageOutLeft 900ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .aspect-panel.page-slide-in-from-left {
      animation: slidePageInFromLeft 900ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .star-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .background-star {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 5px rgba(210, 225, 255, 0.8);
      opacity: 0.15;
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .earth {
      position: absolute;
      top: 50%;
      right: max(-26vw, -325px);
      z-index: 0;
      width: min(52vw, 650px);
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 50%;
      transform: translateY(-50%);
      box-shadow: inset 28px 0 55px rgba(255, 255, 255, 0.13), inset -70px 0 95px rgba(0, 0, 0, 0.92), 0 0 14px rgba(255, 255, 255, 0.9), 0 0 38px rgba(255, 255, 255, 0.3);
      view-transition-name: earth;
    }

    .earth-surface {
      position: absolute;
      inset: -18%;
      background: url('https://lh3.googleusercontent.com/d/1z5zf7wg0GvltGJenPYuOCin_iKQhEq5P') center / cover no-repeat;
      animation: earthRotate 210s linear infinite;
    }

    .earth::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, transparent 42%, rgba(0, 0, 0, 0.82) 100%);
    }

    .shooting-star {
      position: absolute;
      width: 110px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(220, 235, 255, 0.95), #ffffff);
      box-shadow: 0 0 8px rgba(210, 230, 255, 0.9);
      animation: shootAcross 1.1s ease-out forwards;
      transform-origin: right center;
    }

    /* Top Left Header Navigation */
    .top-header {
      position: absolute;
      top: 5%;
      left: 6%;
      z-index: 10;
    }

    .top-header nav {
      display: flex;
      gap: 2vw;
    }

    .nav-link {
      color: #888888;
      text-decoration: none;
      font-size: 1vw;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ffffff;
    }

    /* Left-aligned wrapper for text and button */
    .hero-text-block {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 16px; /* Space between elements */
      align-items: flex-start;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* Main Headline */
    .slide-text-main {
      font-size: 3.2vw; /* Scaled relative to viewport width for 16:9 panel */
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      animation: slideInLeft 1s ease-out forwards;
    }

    .slide-text-main i {
      font-style: italic;
    }

    /* Subtitle */
    .slide-text-sub {
      font-size: 1.5vw;
      font-weight: 400;
      color: #b3b3b3;
      margin: 0;
      opacity: 0;
      animation: slideInLeft 1.5s ease-out 0.5s forwards;
    }

    /* 4-Pointed Star Button Styling */
    .star-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      outline: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      margin-top: 12px;
      align-self: center; /* Center button horizontally in panel */
      margin-right: 12%;  /* Offset to center relative to overall 16:9 frame */
      opacity: 0;
      animation: fadeIn 1.5s ease-out 2s forwards;
      z-index: 20; /* Keeps the expanding star above overall content */
    }

    /* A viewport-level copy of the star makes the page wipe independent of
       the 16:9 panel's clipping bounds. */
    .star-transition {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
    }

    .star-transition svg {
      position: absolute;
      left: var(--star-x, 50vw);
      top: var(--star-y, 50vh);
      width: 48px;
      height: 48px;
      fill: #ffffff;
      filter: drop-shadow(0 0 20px #ffffff);
      transform: translate(-50%, -50%) scale(0);
      transform-origin: center;
    }

    .star-transition.is-expanding {
      opacity: 1;
    }

    .star-transition.is-expanding svg {
      animation: coverScreen 900ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .star-icon {
      width: 3vw; /* Dynamically scales with the 16:9 viewport panel */
      min-width: 32px;
      height: 3vw;
      min-height: 32px;
      fill: #ffffff;
      /* Smooth transitions for hover and expand effects */
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1), fill 0.8s ease, filter 0.8s ease;
      /* Continuous pulse glow animation */
      animation: starPulse 5s infinite ease-in-out;
    }

    .star-button-label {
      margin-top: 12px;
      color: #b3b3b3;
      font-size: 0.8vw;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    /* Hover State: Grows slightly, turns yellow, and glows */
    .star-button:hover .star-icon {
      fill: #ffeb3b; /* Bright Yellow */
      transform: scale(1.4) rotate(90deg); /* Scales up and rotates */
      filter: drop-shadow(0 0 12px #ffeb3b);
      animation: none; /* Stops pulse to give full control to hover transform */
    }

    .star-button:hover .star-button-label {
      color: #ffffff;
    }

    /* Keyframes for sliding text */
    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-60px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slidePageOutLeft {
      to { transform: translateX(-110vw); }
    }

    @keyframes slidePageInFromLeft {
      from { transform: translateX(-110vw); }
      to { transform: translateX(0); }
    }

    ::view-transition-old(root) {
      animation: slidePageOutLeft 900ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    ::view-transition-new(root) {
      animation: slidePageInFromLeft 900ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    /* Keyframes for button fade in */
    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Keyframes for star pulse glow effect */
    @keyframes starPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
      }
      50% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.9));
      }
    }

    @keyframes coverScreen {
      to {
        transform: translate(-50%, -50%) scale(160) rotate(180deg);
      }
    }

    @keyframes shootAcross {
      from { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      12% { opacity: 1; }
      to { transform: translate(-420px, 295px) rotate(-35deg); opacity: 0; }
    }

    @keyframes earthRotate {
      to { transform: rotate(360deg); }
    }

  </style>
</head>
<body>

  <div class="star-transition" id="starTransition" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 0 C12 7, 17 12, 24 12 C17 12, 12 17, 12 24 C12 17, 7 12, 0 12 C7 12, 12 7, 12 0 Z"/>
    </svg>
  </div>

  <!-- 16:9 Aspect Ratio Frame -->
  <div class="aspect-panel">

    <div class="star-field" id="starField" aria-hidden="true"></div>
    <div class="earth" aria-hidden="true"><div class="earth-surface"></div></div>

    <!-- Top Left Header -->
    <header class="top-header">
      <nav>
        <a href="index.html" class="nav-link active">Home</a>
        <a href="about.html" class="nav-link">Projects</a>
      </nav>
    </header>

    <div class="hero-text-block">
      <div>
        <h1 class="slide-text-main">Hi I'm <i>Jeff Wu</i></h1>
        <p class="slide-text-sub">An Aerospace Engineer studying at Toronto Metropolitan University</p>
      </div>

      <!-- 4-Pointed Star Button linking to a new page -->
      <a href="about.html" class="star-button" id="starBtn" aria-label="Open projects page">
        <svg class="star-icon" id="starIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <!-- 4-Pointed Star Path -->
          <path d="M12 0 C12 7, 17 12, 24 12 C17 12, 12 17, 12 24 C12 17, 7 12, 0 12 C7 12, 12 7, 12 0 Z"/>
        </svg>
        <span class="star-button-label">Click here to begin</span>
      </a>
    </div>
  </div>

  <script>
    function createStarField() {
      const field = document.getElementById('starField');
      const starCount = 70;

      for (let index = 0; index < starCount; index += 1) {
        const star = document.createElement('span');
        const size = 1 + Math.random() * 2.2;
        star.className = 'background-star';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        field.appendChild(star);

        const twinkle = () => {
          const brightness = 0.15 + Math.random() * 0.8;
          const scale = 0.8 + Math.random() * 1.5;
          star.style.opacity = brightness;
          star.style.transform = `scale(${scale})`;
          setTimeout(twinkle, 500 + Math.random() * 3500);
        };

        setTimeout(twinkle, Math.random() * 2500);
      }

      const launchShootingStar = () => {
        const shootingStar = document.createElement('span');
        shootingStar.className = 'shooting-star';
        shootingStar.style.left = `${45 + Math.random() * 50}%`;
        shootingStar.style.top = `${Math.random() * 45}%`;
        field.appendChild(shootingStar);

        shootingStar.addEventListener('animationend', () => shootingStar.remove());
        setTimeout(launchShootingStar, 6000 + Math.random() * 9000);
      };

      setTimeout(launchShootingStar, 3500 + Math.random() * 5000);
    }

    createStarField();

    const panel = document.querySelector('.aspect-panel');
    if (sessionStorage.getItem('pageSlideDirection') === 'from-projects') {
      sessionStorage.removeItem('pageSlideDirection');
      panel.classList.add('page-slide-in-from-left');
    }

    // Browsers without cross-document View Transitions retain the CSS fallback.
    if (!document.startViewTransition) {
      document.querySelectorAll('.top-header .nav-link').forEach((link) => {
        link.addEventListener('click', (event) => {
          if (new URL(link.href).pathname === window.location.pathname) return;

          event.preventDefault();
          sessionStorage.setItem('pageSlideDirection', 'to-projects');
          panel.classList.add('page-slide-out-left');
          setTimeout(() => window.location.assign(link.href), 900);
        });
      });
    }

    const starBtn = document.getElementById('starBtn');
    const transition = document.getElementById('starTransition');

    starBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (transition.classList.contains('is-expanding')) return;

      const rect = this.getBoundingClientRect();
      transition.style.setProperty('--star-x', `${rect.left + rect.width / 2}px`);
      transition.style.setProperty('--star-y', `${rect.top + rect.height / 2}px`);
      transition.classList.add('is-expanding');

      // Let the star fully cover the current page before loading the next one.
      setTimeout(() => {
        sessionStorage.setItem('transitionFromHome', 'true');
        window.location.assign(this.href);
      }, 900);
    });
  </script>

</body>
</html>
