<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Jeff Wu</title>

  <!-- Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

  <style>
    @view-transition {
      navigation: auto;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Outer Canvas */
    body {
      background-color: #0a0a0a;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Michroma', sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Fixed 16:9 Aspect Ratio Container */
    .aspect-panel {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      outline: 1px solid #222222; 
    }

    .aspect-panel.page-slide-out-right {
      animation: slidePageOutRight 900ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .aspect-panel.page-slide-in-from-right {
      animation: slidePageInFromRight 900ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .star-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .background-star {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 5px rgba(210, 225, 255, 0.8);
      opacity: 0.15;
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .earth {
      position: absolute;
      top: 50%;
      left: max(-26vw, -325px);
      z-index: 0;
      width: min(52vw, 650px);
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 50%;
      transform: translateY(-50%);
      box-shadow: inset -28px 0 55px rgba(255, 255, 255, 0.13), inset 70px 0 95px rgba(0, 0, 0, 0.92), 0 0 14px rgba(255, 255, 255, 0.9), 0 0 38px rgba(255, 255, 255, 0.3);
      view-transition-name: earth;
    }

    .earth-surface {
      position: absolute;
      inset: -18%;
      background: url('https://lh3.googleusercontent.com/d/1z5zf7wg0GvltGJenPYuOCin_iKQhEq5P') center / cover no-repeat;
      animation: earthRotate 210s linear infinite;
    }

    .earth::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to left, transparent 42%, rgba(0, 0, 0, 0.82) 100%);
    }

    .shooting-star {
      position: absolute;
      width: 110px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(220, 235, 255, 0.95), #ffffff);
      box-shadow: 0 0 8px rgba(210, 230, 255, 0.9);
      animation: shootAcross 1.1s ease-out forwards;
      transform-origin: right center;
    }

    /* Full-screen transition overlay container */
    .transition-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      pointer-events: none;
      opacity: 1;
      background: transparent;
      transition: opacity 700ms ease;
    }

    .transition-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      transition: opacity 700ms ease, visibility 0s linear 700ms;
    }

    .transition-star {
      width: 3vw;
      min-width: 32px;
      height: 3vw;
      min-height: 32px;
      fill: #ffffff;
      filter: drop-shadow(0 0 30px #ffffff);
      /* Matches the fully expanded star from the home-page transition. */
      transform: scale(160) rotate(180deg);
    }

    /* Top Left Header Navigation */
    .top-header {
      position: absolute;
      top: 5%;
      left: 6%;
      z-index: 10;
    }

    .top-header nav {
      display: flex;
      gap: 2vw;
    }

    .nav-link {
      color: #888888;
      text-decoration: none;
      font-size: 1vw;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #ffffff;
    }

    /* 3D Carousel Stage */
    .carousel-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      overflow: hidden;
      user-select: none;
      font-family: 'Michroma', sans-serif;
    }

    /* Scaled-down carousel track size */
    .carousel-track {
      position: relative;
      width: 360px;
      height: 420px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* Scaled-down cards */
    .carousel-card {
      position: absolute;
      width: 360px;
      height: 420px;
      top: 0;
      left: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      background: #000;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: opacity 0.4s ease, box-shadow 0.4s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .carousel-card.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .carousel-card .image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .carousel-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .carousel-card.is-visible:hover {
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.7), 0 0 16px rgba(255, 255, 255, 0.2);
      --hover-scale: scale(1.08); 
    }

    .carousel-card.is-visible:hover img {
      transform: scale(1.05);
    }

    .card-caption {
      width: 100%;
      height: 40px;
      background: rgba(20, 20, 20, 0.95);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 12px;
      font-size: 11px;
      font-family: 'Michroma', sans-serif;
      letter-spacing: 0.5px;
    }

    /* Double-ended Scroll Indicator Arrow */
    .carousel-arrow-indicator {
      position: absolute;
      bottom: 18%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888888;
      opacity: 0.75;
      transition: opacity 0.3s ease, color 0.3s ease;
      pointer-events: none;
    }

    .carousel-arrow-indicator svg {
      width: 225px;
      height: 54px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .carousel-arrow-label {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @keyframes shootAcross {
      from { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      12% { opacity: 1; }
      to { transform: translate(-420px, 295px) rotate(-35deg); opacity: 0; }
    }

    @keyframes slidePageOutRight {
      to { transform: translateX(110vw); }
    }

    @keyframes slidePageInFromRight {
      from { transform: translateX(110vw); }
      to { transform: translateX(0); }
    }

    ::view-transition-old(root) {
      animation: slidePageOutRight 900ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    ::view-transition-new(root) {
      animation: slidePageInFromRight 900ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes earthRotate {
      to { transform: rotate(360deg); }
    }

  </style>
</head>
<body>

  <!-- Locked 16:9 Aspect Ratio Panel Container -->
  <div class="aspect-panel">

    <div class="star-field" id="starField" aria-hidden="true"></div>
    <div class="earth" aria-hidden="true"><div class="earth-surface"></div></div>

    <!-- Transition Overlay Star -->
    <div class="transition-overlay" id="transitionOverlay">
      <svg class="transition-star" id="transitionStar" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0 C12 7, 17 12, 24 12 C17 12, 12 17, 12 24 C12 17, 7 12, 0 12 C7 12, 12 7, 12 0 Z"/>
      </svg>
    </div>

    <!-- Top Left Header Navigation -->
    <header class="top-header">
      <nav>
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link active">Projects</a>
      </nav>
    </header>

    <!-- Carousel Container -->
    <div class="carousel-container" id="carouselContainer">
      <div class="carousel-track" id="carouselTrack">
        
        <!-- Image 1 -->
        <a href="model-rocket.html" class="carousel-card">
          <div class="image-wrapper">
            <img src="https://lh3.googleusercontent.com/d/1y2SFx5qlkz0fMuWvqpw5LoEbERfuD74p" alt="Model Rocket">
          </div>
          <div class="card-caption">Model Rocket</div>
        </a>
        
        <!-- Image 2 -->
        <a href="walking-robot.html" class="carousel-card">
          <div class="image-wrapper">
            <img src="https://lh3.googleusercontent.com/d/1WX0aeZU4wyMfDqcR5A_rLiZXPKOxxBru" alt="Walking Robot">
          </div>
          <div class="card-caption">Walking Robot</div>
        </a>
        
        <!-- Image 3 -->
        <a href="hydraulic-arm.html" class="carousel-card">
          <div class="image-wrapper">
            <img src="https://lh3.googleusercontent.com/d/1YLZtUHzBvYdAmNV1vJ_qVKuIfb4Trbx3" alt="Hydraulic Arm">
          </div>
          <div class="card-caption">Hydraulic Arm</div>
        </a>
        
        <!-- Image 4 -->
        <a href="flight-simulator.html" class="carousel-card">
          <div class="image-wrapper">
            <img src="https://lh3.googleusercontent.com/d/10TL2ysTJtELxGnbQl7qGfH3eSVyQfBwY" alt="Flight Simulator">
          </div>
          <div class="card-caption">Flight Simulator</div>
        </a>
        
        <!-- Image 5 -->
        <a href="ping-pong-launcher.html" class="carousel-card">
          <div class="image-wrapper">
            <img src="https://lh3.googleusercontent.com/d/1vXo77X_ag7KayiryZckf-RBtKNYfrz4_" alt="Ping Pong Launcher">
          </div>
          <div class="card-caption">Ping Pong Launcher</div>
        </a>

      </div>

      <!-- Double-Ended Arrow Indicator at bottom -->
      <div class="carousel-arrow-indicator">
        <svg viewBox="0 0 75 18" xmlns="http://www.w3.org/2000/svg">
          <!-- Left Arrowhead -->
          <polyline points="7,3 1,9 7,15" />
          <!-- Horizontal Line -->
          <line x1="1" y1="9" x2="69" y2="9" />
          <!-- Right Arrowhead -->
          <polyline points="63,3 69,9 63,15" />
        </svg>
        <span class="carousel-arrow-label">Spin to explore</span>
      </div>
    </div>

  </div>

  <script>
    function createStarField() {
      const field = document.getElementById('starField');
      const starCount = 70;

      for (let index = 0; index < starCount; index += 1) {
        const star = document.createElement('span');
        const size = 1 + Math.random() * 2.2;
        star.className = 'background-star';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        field.appendChild(star);

        const twinkle = () => {
          const brightness = 0.15 + Math.random() * 0.8;
          const scale = 0.8 + Math.random() * 1.5;
          star.style.opacity = brightness;
          star.style.transform = `scale(${scale})`;
          setTimeout(twinkle, 500 + Math.random() * 3500);
        };

        setTimeout(twinkle, Math.random() * 2500);
      }

      const launchShootingStar = () => {
        const shootingStar = document.createElement('span');
        shootingStar.className = 'shooting-star';
        shootingStar.style.left = `${45 + Math.random() * 50}%`;
        shootingStar.style.top = `${Math.random() * 45}%`;
        field.appendChild(shootingStar);

        shootingStar.addEventListener('animationend', () => shootingStar.remove());
        setTimeout(launchShootingStar, 6000 + Math.random() * 9000);
      };

      setTimeout(launchShootingStar, 3500 + Math.random() * 5000);
    }

    createStarField();

    const panel = document.querySelector('.aspect-panel');
    if (sessionStorage.getItem('pageSlideDirection') === 'to-projects') {
      sessionStorage.removeItem('pageSlideDirection');
      panel.classList.add('page-slide-in-from-right');
    }

    // Browsers without cross-document View Transitions retain the CSS fallback.
    if (!document.startViewTransition) {
      document.querySelectorAll('.top-header .nav-link').forEach((link) => {
        link.addEventListener('click', (event) => {
          if (new URL(link.href).pathname === window.location.pathname) return;

          event.preventDefault();
          sessionStorage.setItem('pageSlideDirection', 'from-projects');
          panel.classList.add('page-slide-out-right');
          setTimeout(() => window.location.assign(link.href), 900);
        });
      });
    }

    // Page Entry Transition Handler
    window.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('transitionOverlay');
      if (sessionStorage.getItem('transitionFromHome') === 'true') {
        sessionStorage.removeItem('transitionFromHome');

        requestAnimationFrame(() => requestAnimationFrame(() => {
          overlay.classList.add('hidden');
        }));
      } else {
        overlay.classList.add('hidden');
      }
    });

    // Carousel Logic
    (function() {
      const container = document.getElementById('carouselContainer');
      const track = document.getElementById('carouselTrack');
      const cards = document.querySelectorAll('.carousel-card');
      
      const totalCards = cards.length;
      const angleStep = 360 / totalCards;
      const radius = 300;
      
      let rotationDegree = 0;
      let isScrolling = false;
      let scrollDeltaAccumulator = 0;
      const scrollThreshold = 60;

      cards.forEach((card, index) => {
        const cardAngle = index * angleStep;
        card.dataset.angle = cardAngle;
        card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius}px) var(--hover-scale, scale(1))`;

        card.addEventListener('click', (e) => {
          e.preventDefault();
          const destination = card.getAttribute('href');
          if (destination) window.location.assign(destination);
        });
      });

      function updateCarousel() {
        track.style.transform = `translateZ(-${radius}px) rotateY(${rotationDegree}deg)`;

        cards.forEach((card) => {
          const baseAngle = parseFloat(card.dataset.angle);
          let currentAngle = (baseAngle + rotationDegree) % 360;
          if (currentAngle > 180) currentAngle -= 360;
          if (currentAngle < -180) currentAngle += 360;

          if (Math.abs(currentAngle) <= 75) {
            card.classList.add('is-visible');
          } else {
            card.classList.remove('is-visible');
          }
        });
      }

      updateCarousel();

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        
        const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        scrollDeltaAccumulator += delta;

        if (isScrolling) return;

        if (Math.abs(scrollDeltaAccumulator) >= scrollThreshold) {
          isScrolling = true;

          if (scrollDeltaAccumulator > 0) {
            rotationDegree -= angleStep;
          } else {
            rotationDegree += angleStep;
          }

          updateCarousel();
          scrollDeltaAccumulator = 0;

          setTimeout(() => {
            isScrolling = false;
          }, 450);
        }
      }, { passive: false });
    })();
  </script>

</body>
</html>
